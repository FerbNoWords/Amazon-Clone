<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="movie_website_style.css">
    <title>Movie Spot</title>
</head>

<body>
    <header>
        <nav>
            <div class="topbar">
                <div class="logo">Movie Spot</div>

                <div class="colapse">
                    <button>
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 6H20 M4 12H20 M4 18H20" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="navlinks">
                <a href="#home">Home</a>
                <a href="#movies">Movies</a>
                <a href="#series">Series</a>
                <a href="#contact">Contact</a>
            </div>
            <div class="search">
                <input type="text" name="search" placeholder="Search...">
            </div>
        </nav>
    </header>

    <section class="banner">
        <div class="trailer">
            <video src="assets/Jurassic World - Official Trailer (HD).mp4" muted autoplay loop poster="assets/dino.png" 
            ></video>
            <div class="details">
                <div class="movie-icon">
                    <img src="assets/Jurassic World.png" alt="movie-icon">
                </div>
                <div class="release">
                    2025 : U/A 13+ : Hind/English
                </div>
                <div class="describe">
                    <p>Claire’s two visiting nephews, Zach and Gray, get trapped in the restricted zone during the
                        chaos. Owen and Claire team up to track down the boys while trying to contain the carnage.</p>
                </div>
                <div class="btn">
                    <button>Click to Watch</button>
                </div>
            </div>
        </div>
    </section>
