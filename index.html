<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign-Up Page</title>
    <style>
        * {
            font-family: sans-serif;
        }

        img {
            height: 5vw;
            transform: translate(-50%, -1vw);
            margin-left: 50%;
        }

        .signup {
            width: 24vw;
            height: fit-content;
            border: 0.5px solid grey;
            border-radius: 5pt;
            padding: 2vw;
            margin: auto;
            margin-top: -1vw;
        }

        .label1 {
            font-size: 2.2vw;
        }

        .label2 {
            font-size: 1.1vw;
            font-weight: bold;
            padding: 8pt 0;
        }

        input {
            width: 22.6vw;
            height: 2.5vw;
            font-size: 1.2vw;
            padding: 0 5pt;
        }

        button {
            width: 100%;
            margin: 10pt 0;
            border: none;
            font-size: 1.15vw;
            border-radius: 1.5vw;
            padding: 0.7vw 0;
            background-color: #FFD814;
        }

        button:hover {
            background-color: #ebc400;
        }

        a {
            color: #2167A1;
        }

        .label3 {
            font-size: 1vw;
        }

        .divider {
            margin: 10pt 0;
            height: 0.5px;
            width: 100%;
            background-color: grey;
        }

        .label4 {
            font-size: 1vw;
            font-weight: bold;
            margin-bottom: 0.8vw;
        }

        .label5 {
            font-size: 1.2vw;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <img src="./Amazon Clone/black-logo.jpg" alt="loogo">

    <div class="signup">
        <div class="label1">Log into account</div>
        <div class="label2">Enter mobile number or email</div>
        <input type="email" value="Admin@gamil.com" disabled>
        <a href="./Amazon Clone/home-page.html"><button>Continue</button></a>
        <!-- <div class="label3">By continuing, you agree to Amazon's <a href="">Conditions of Use</a> and <a href="">Privacy
                Notice</a>.</div>
        <div class="divider"></div>
        <div class="label4">Buying for work?</div>
        <a class="label5" href="">Create a free business account</a> -->
    </div>
</body>

</html>
